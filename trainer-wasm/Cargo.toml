[package]
name = "trainer-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for the alg trainer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cube-core = { path = "../cube-core" }
trainer-core = { path = "../trainer-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
